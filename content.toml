it = "La Collezione"
zh = "馆藏"

[page.collection.intro]
en = '''
<p>Every Chapter leaves something behind. These are the works Visions
holds, when each entered the collection, and where it can be found today.</p>

<p>Works travel. If you would like to borrow one, or to talk to us about an
acquisition, write to us.</p>
'''
it = '''
<p>Ogni Capitolo lascia qualcosa dietro di sé. Queste sono le opere che Visions
conserva, quando sono entrate in collezione e dove si trovano oggi.</p>

<p>Le opere viaggiano. Se desiderate richiederne una in prestito, o parlare con
noi di un'acquisizione, scriveteci.</p>
'''
zh = '''
<p>每一个章节都会留下一些东西。以下是 Visions 所收藏的作品：每件作品何时入藏，
以及目前的所在。</p>

<p>作品会流动。如果您希望借展某件作品，或与我们商谈收藏事宜，请与我们联系。</p>
'''

