# =============================================================================
#  VISIONS — ALL SITE COPY, ALL LANGUAGES, ONE FILE.
#
#  This file is the single source of truth for every word on visions.land.
#  Edit here, then run:
#
#      python3 build.py
#
#  ...which regenerates index.html, chapters.html, collection.html and the
#  it/ and zh/ versions of all three. Never edit those files directly.
#
#  LANGUAGES. Every string has an `en`, an `it` and a `zh`. English is the
#  source and the fallback: leave `it` or `zh` empty and the build quietly
#  uses the English, then tells you exactly which strings are outstanding.
#  Nothing ever silently disappears from the site.
#
#  PROSE values are raw HTML fragments, so <p>, <em>, <strong> and <a> all
#  work as you would expect. Keep each paragraph in its own <p>.
#  SHORT values are plain text and must not contain HTML.
# =============================================================================

[site]
domain = "https://visions.land"
languages = ["en", "it", "zh"]

# BCP-47 tags written into <html lang="...">, and the labels on the switcher.
langtags = { en = "en", it = "it", zh = "zh-Hans" }
langlabels = { en = "EN", it = "IT", zh = "中文" }

email_info = "info@visions.land"
email_partnerships = "partnerships@visions.land"
email_collection = "collection@visions.land"
instagram = "https://instagram.com/visions.land"
instagram_handle = "@visions.land"

# Shown on the collection page. Bump this whenever you check that every
# "currently held at" below is still true.
provenance_reviewed = "2026-11"

# Optional hero image for the front page. Put a 1280x635 JPEG in assets/ and
# name it here to switch the hero on; leave empty for no hero.
hero = ""
hero_alt = { en = "", it = "", zh = "" }


# =============================================================================
#  FRONT PAGE
# =============================================================================

[page.index.title]
en = "Visions — art at the end of the world as we know it"
it = "Visions — arte alla fine del mondo come lo conosciamo"
zh = "Visions — 在我们所知的世界终结之处做艺术"

[page.index.description]
en = "Visions is an unstructured group of professionals working across culture and technology. We organise art events, prizes, exhibitions and residencies."
it = "Visions è un gruppo non strutturato di professionisti che lavorano tra cultura e tecnologia. Organizziamo eventi d'arte, premi, mostre e residenze."
zh = "Visions 是一个由文化与技术领域专业人士组成的非结构化团体。我们组织艺术活动、奖项、展览与驻留项目。"

# The wordmark sits directly above this, so the heading says something rather
# than repeating the name.
[page.index.heading]
en = "Art at the end of the world as we know it"
it = "Arte alla fine del mondo come lo conosciamo"
zh = "在我们所知的世界终结之处做艺术"

[about.body]
en = '''
<p>Visions is an unstructured group of professionals working across culture
and technology. We organise art events, prizes, exhibitions and residencies.</p>

<p>We work on what is actually happening. The civilisation that was promised
to us is running out of road. Machine intelligence is being built faster than
anyone can steer it. Feudal power is being rebuilt in software, and the
concept of nation is quietly coming
apart. These are not metaphors and they are not predictions. They are the
conditions under which art now gets made.</p>

<p>We are not a foundation and we are not a gallery. We have no permanent
address and no permanent programme. Each year we open a <em>chapter</em>: a
theme, a call, a prize, an exhibition.</p>
'''
it = '''
<p>Visions è un gruppo non strutturato di professionisti che lavorano tra
cultura e tecnologia. Organizziamo eventi d'arte, premi, mostre e residenze.</p>

<p>Lavoriamo su ciò che sta davvero accadendo. La civiltà che ci era stata
promessa ha esaurito la strada. L'intelligenza artificiale viene costruita più
in fretta di quanto chiunque sia in grado di governarla. Il potere feudale
viene ricostruito nel software e il concetto di nazione si sta disfacendo
in silenzio. Non sono metafore e
non sono previsioni: sono le condizioni in cui oggi si fa arte.</p>

<p>Non siamo una fondazione e non siamo una galleria. Non abbiamo una sede
fissa né un programma permanente. Ogni anno apriamo un <em>capitolo</em>: un
tema, un bando, un premio, una mostra.</p>
'''
zh = '''
<p>Visions 是一个由文化与技术领域专业人士组成的非结构化团体。我们组织艺术活动、
奖项、展览与驻留项目。</p>

<p>我们关注的是正在真实发生的事。曾经许诺给我们的那种文明已走到尽头。机器智能的
建造速度，已超出任何人能够驾驭的范围。封建式的权力正在软件中被重建，而民族国家
的概念正在悄然解体。这些既不是隐喻，也不是预言，而是今天艺术得以产生的现实条件。</p>

<p>我们不是基金会，也不是画廊。我们没有固定的地址，也没有长期的节目表。每一年，
我们开启一个<em>章节</em>：一个主题、一次征集、一个奖项、一场展览。</p>
'''



# =============================================================================
#  CHAPTERS PAGE
# =============================================================================

[page.chapters.title]
en = "Chapters — Visions"
it = "Capitoli — Visions"
zh = "章节 — Visions"

[page.chapters.description]
en = "Here you will find the archive of all chapters we opened until now."
it = "Qui trovate l'archivio di tutti i capitoli che abbiamo aperto finora."
zh = "这里是我们迄今开启的所有章节的档案。"

[page.chapters.heading]
en = "Chapters"
it = "Capitoli"
zh = "章节"

[page.chapters.intro]
en = '''
<p>Each year opens a chapter — a theme, a call, and the body of work that
answers it. Each one keeps its own address, and stays there.</p>
'''
it = '''
<p>Ogni anno apre un capitolo: un tema, un bando e il corpo di opere che gli
risponde. Ognuno conserva il proprio indirizzo, e lì resta.</p>
'''
zh = '''
<p>每一年开启一个章节：一个主题、一次征集，以及回应它的作品。每个章节都有自己的
网址，并长久留在那里。</p>
'''

# Badge on a chapter whose site is not online yet.
[page.chapters.soon]
en = "Coming soon"
it = "In arrivo"
zh = "即将上线"


# =============================================================================
#  THE CHAPTER ARCHIVE  (data — newest first)
#
#  Leave `url` empty and the entry renders greyed out and unclickable, with
#  the "coming soon" badge above. Fill it in to make it a live link.
#
#  `accent` is optional: a hex colour, taken from the --card-border token of
#  that chapter's own site, used for the entry's border so each chapter
#  carries its own colour on an otherwise monochrome page. Omit it for a
#  neutral border.
# =============================================================================

[[chapters]]
numeral = "III"
year = "2027"
url = "https://2027.visions.land"
accent = "#25528f"   # --card-border of that chapter's own site
title = "Roko's Basilisk"
note.en = "On machine intelligence, acceleration, and what arrives from the other side of the event horizon."
note.it = "Sull'intelligenza artificiale, l'accelerazione e ciò che arriva dall'altra parte dell'orizzonte degli eventi."
note.zh = "关于机器智能、加速，以及从事件视界另一侧到来的东西。"

[[chapters]]
numeral = "II"
year = "2026"
url = "https://2026.visions.land"
accent = "#952527"   # --card-border of that chapter's own site
title = "I popoli del mare"
note.en = "A prize on technology, Europe and nationhood. Won by Numero Cromatico."
note.it = "Un premio su tecnologia, Europa e idea di nazione. Vinto da Numero Cromatico."
note.zh = "一个关于技术、欧洲与民族国家的奖项。由 Numero Cromatico 获得。"

[[chapters]]
numeral = "I"
